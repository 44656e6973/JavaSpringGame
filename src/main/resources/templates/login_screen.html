<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="../static/login/login_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../static/login/login_script.js"></script>
</head>
<body>
<div class="login-container">

        <img src="../icons/icon3.png" alt="Gamepad" class="icon-lg">

    <h1 class="login-title">Вход в систему</h1>
    <p class="login-subtitle">Введите ваш email и пароль для входа</p>

    <form id="loginForm">
        <div class="form-group">
            <label for="username" class="form-label">Email или логин</label>
            <div class="input-icon">
                <i class="fas fa-envelope"></i>
                <input type="text" id="username" class="form-input" placeholder="example@mail.com" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Пароль</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="login-btn">Войти</button>
    </form>

    <div id="statusMessage" class="status-message"></div>

    <a href="#" class="forgot-password">Забыли пароль?</a>
</div>


</body>
</html>
